<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="358" viewBox="0 0 1120 358" font-family="Helvetica, Arial, sans-serif" font-size="15">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#333"/></marker><marker id="as" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#333"/></marker></defs>
<rect width="1120" height="358" fill="#ffffff"/>
<rect x="165" y="12" width="935" height="238" rx="10" fill="#fffbe6" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="632.5" y="36" text-anchor="middle" font-weight="bold">Every UAV (× N): its own view, its own decisions, no central planner</text>
<rect x="10" y="50" width="120" height="152" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="1.6"/>
<text x="70.0" y="78" text-anchor="middle" font-weight="bold">Search arena</text>
<text x="70.0" y="106" text-anchor="middle">K sectors,</text>
<text x="70.0" y="130" text-anchor="middle">one RGB +</text>
<text x="70.0" y="154" text-anchor="middle">thermal frame</text>
<text x="70.0" y="178" text-anchor="middle">per sector</text>
<rect x="190" y="50" width="185" height="152" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.6"/>
<text x="282.5" y="78" text-anchor="middle" font-weight="bold">1. Perception</text>
<text x="282.5" y="106" text-anchor="middle">RGB + thermal fusion</text>
<text x="282.5" y="130" text-anchor="middle">YOLO11s, 1280 px</text>
<text x="282.5" y="154" text-anchor="middle">box → sector position</text>
<text x="282.5" y="178" text-anchor="middle">alert: victim, time</text>
<rect x="433" y="50" width="185" height="152" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.6"/>
<text x="525.5" y="78" text-anchor="middle" font-weight="bold">2. Mesh comms</text>
<text x="525.5" y="106" text-anchor="middle">RF link gives PER</text>
<text x="525.5" y="130" text-anchor="middle">status msg every 5 s</text>
<text x="525.5" y="154" text-anchor="middle">per-recipient buffers</text>
<text x="525.5" y="178" text-anchor="middle">store-carry-forward</text>
<rect x="676" y="50" width="185" height="152" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.6"/>
<text x="768.5" y="78" text-anchor="middle" font-weight="bold">3. Swarm control</text>
<text x="768.5" y="106" text-anchor="middle">view from beacons</text>
<text x="768.5" y="130" text-anchor="middle">EW-CVT, weight w(B)</text>
<text x="768.5" y="154" text-anchor="middle">hysteresis, claims</text>
<text x="768.5" y="178" text-anchor="middle">lease failover</text>
<rect x="919" y="50" width="160" height="152" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.6"/>
<text x="999.0" y="78" text-anchor="middle" font-weight="bold">Flight &amp; battery</text>
<text x="999.0" y="106" text-anchor="middle">route over sectors</text>
<text x="999.0" y="130" text-anchor="middle">battery drain</text>
<text x="999.0" y="154" text-anchor="middle">return at 15 %</text>
<rect x="433" y="280" width="185" height="62" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="1.6"/>
<text x="525.5" y="308" text-anchor="middle" font-weight="bold">Peer UAVs</text>
<text x="525.5" y="336" text-anchor="middle">status, alerts</text>
<rect x="919" y="280" width="160" height="62" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="1.6"/>
<text x="999.0" y="308" text-anchor="middle" font-weight="bold">Ground station</text>
<text x="999.0" y="336" text-anchor="middle">passive alert sink</text>
<polyline points="130,126.0 190,126.0" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="160.0" y="118.0" text-anchor="middle" font-size="13" fill="#222" paint-order="stroke" stroke="#ffffff" stroke-width="4">frames</text>
<polyline points="375,126.0 433,126.0" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="404.0" y="118.0" text-anchor="middle" font-size="13" fill="#222" paint-order="stroke" stroke="#ffffff" stroke-width="4">alerts</text>
<polyline points="618,126.0 676,126.0" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="647.0" y="118.0" text-anchor="middle" font-size="13" fill="#222" paint-order="stroke" stroke="#ffffff" stroke-width="4">peers</text>
<polyline points="861,126.0 919,126.0" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="890.0" y="118.0" text-anchor="middle" font-size="13" fill="#222" paint-order="stroke" stroke="#ffffff" stroke-width="4">route</text>
<polyline points="954.2,202 954.2,226 768.5,226 768.5,202" fill="none" stroke="#333" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<text x="800" y="244" text-anchor="middle" font-size="13" fill="#222" paint-order="stroke" stroke="#ffffff" stroke-width="4">position, battery</text>
<polyline points="525.5,202 525.5,280" fill="none" stroke="#333" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar)" marker-start="url(#as)"/>
<text x="588" y="272" text-anchor="middle" font-size="13" fill="#222" paint-order="stroke" stroke="#ffffff" stroke-width="4">status, alerts</text>
<polyline points="618,311.0 919,311.0" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="768" y="306" text-anchor="middle" font-size="13" fill="#222" paint-order="stroke" stroke="#ffffff" stroke-width="4">alerts: on contact or at return to base</text>
<polyline points="1043.8,280 1043.8,202" fill="none" stroke="#333" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<text x="1020" y="268" text-anchor="middle" font-size="13" fill="#222" paint-order="stroke" stroke="#ffffff" stroke-width="4">launch</text>
</svg>